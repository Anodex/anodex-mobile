name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is a committed binary. This checks it against Gradle's published
      # checksums on every run, so a tampered or accidentally-replaced jar fails here rather
      # than silently executing in CI.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Written to disk only inside the runner, and gitignored so it can never be
      # committed by accident. Absent on a pull request from a fork, where secrets
      # are withheld — the build falls back to Gradle's debug key and still compiles
      # and tests, which is the point of making the signing config conditional.
      - name: Restore the signing key
        run: |
          if [ -z "$ANODEX_KEYSTORE_BASE64" ]; then
            echo "No signing key available; falling back to Gradle's debug key."
            exit 0
          fi
          mkdir -p keystore
          echo "$ANODEX_KEYSTORE_BASE64" | base64 -d > keystore/anodex-release.jks
          echo "Signing key restored."
        env:
          ANODEX_KEYSTORE_BASE64: ${{ secrets.ANODEX_KEYSTORE_BASE64 }}

      # Release, not debug. A debug build sets `android:debuggable="true"`, which lets
      # anyone with USB access and developer mode attach to the running process and read
      # its memory — including the paired device key once it has been decrypted. The APK
      # from here gets sideloaded onto real phones, so it should not be that build.
      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease
        env:
          ANODEX_KEYSTORE_PASSWORD: ${{ secrets.ANODEX_KEYSTORE_PASSWORD }}
          ANODEX_KEY_ALIAS: ${{ secrets.ANODEX_KEY_ALIAS }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Gradle prints BUILD SUCCESSFUL for a test task served FROM-CACHE without running anything,
      # and for one with no tests at all. Read the report instead of trusting the exit code.
      - name: Report what the tests covered
        run: python3 tools/summarize_tests.py

      # The APK every run produces, kept so it can be sideloaded without a local Android
      # toolchain. This is the only way to see the app on a real screen until someone on the
      # project has Android Studio; GitHub keeps it for 90 days.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anodex-mobile-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
